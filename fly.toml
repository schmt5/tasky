# Fly.io configuration for the LearningLine app.
#
# See https://fly.io/docs/reference/configuration/ for information about how to
# use this file.
#
# The machines are stateless — there is no [[mounts]] section on purpose: the
# database is Neon Postgres (DATABASE_URL) and uploads go to a private R2
# bucket (STORAGE_ADAPTER=r2). Migrations run on boot via the Ecto.Migrator
# child in Tasky.Application.
#
# Secrets that must be set before the first deploy (fly secrets set):
#   DATABASE_URL, R2_ACCOUNT_ID, R2_BUCKET, R2_ACCESS_KEY_ID,
#   R2_SECRET_ACCESS_KEY, SECRET_KEY_BASE

app = 'learningline'
# fra is deliberate: it keeps the app in the same region as the Neon project
# (eu-central-1), so every query avoids a cross-region round trip.
primary_region = 'fra'
kill_signal = 'SIGTERM'

[build]

[env]
  MIX_ENV = 'demo'
  PHX_HOST = 'learningline.fly.dev'
  PORT = '8080'
  STORAGE_ADAPTER = 'r2'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
